# Local development stack with hot reloading and volume bind-mounts.
# Run with: docker compose -f compose.dev.yaml up
services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pokemons}
    volumes:
      - ./postgres:/var/lib/postgresql
    expose:
      - "5432"
    ports:
      - "${DB_PORT_BIND:-2300}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-pokemons}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  dev:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CI: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pokemons}?schema=public
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pnpm install --frozen-lockfile --store-dir=/pnpm-store &&
             pnpm run prisma:generate &&
             pnpm exec prisma migrate deploy &&
             pnpm dev"

volumes:
  node_modules:
