name: Bug Report
description: Create a report to help us fix an unexpected error or incorrect behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check if a similar issue already exists before opening a new one.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run command '/...'
        2. Click button '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Please copy and paste any relevant terminal logs or error messages (sanitize sensitive tokens).
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node version, pnpm version, OS, deployment type (local Docker / Render).
      placeholder: Node 22.14, pnpm 10.16, Ubuntu 24.04, Docker
    validations:
      required: false
