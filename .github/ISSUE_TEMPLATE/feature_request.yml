name: Feature Request
description: Suggest an idea or new feature for PokeBotShowdown
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make PokeBotShowdown better? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is (e.g. "I'm always frustrated when...").
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen and how the command or mechanic should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any mockups, screenshots, or Pokemon mechanics references here.
