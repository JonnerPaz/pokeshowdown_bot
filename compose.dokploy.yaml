services:
  db:
    image: postgres:18-alpine
    hostname: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pokemons}
    volumes:
      # PostgreSQL 18 keeps its cluster in /var/lib/postgresql/<major>/docker,
      # so the volume must be mounted one level above the cluster directory.
      # (On PostgreSQL 16 and older this path is /var/lib/postgresql/data.)
      - postgres_data:/var/lib/postgresql
    expose:
      - "5432"
    ports:
      - "${DB_PORT_BIND:-2300}:5432"
    healthcheck:
      # -h 127.0.0.1 forces a TCP check: with the default Unix socket this probe
      # also succeeds against the temporary server initdb starts, reporting the
      # database as healthy before it is actually accepting client connections.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-pokemons}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      pokebot-net:
        aliases:
          - db

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CI: "true"
      API_KEY: ${API_KEY}
      # Hostname of the database. Keep "db" for the bundled service; override it
      # (e.g. DB_HOST=<container-name>) to point at a Dokploy-managed database.
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB:-pokemons}?schema=public}
      BOT_MODE: ${BOT_MODE:-polling}
      DROP_PENDING_UPDATES: ${DROP_PENDING_UPDATES:-true}
      PORT: ${PORT:-5000}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # Public HTTPS URL of the Telegram Mini App. Empty disables /api + the
      # arena menu button. Point it at the Cloudflare tunnel hostname.
      WEBAPP_URL: ${WEBAPP_URL:-}
      WEBAPP_AUTH_MAX_AGE_SEC: ${WEBAPP_AUTH_MAX_AGE_SEC:-}
      ARENA_TURN_TIMEOUT_SEC: ${ARENA_TURN_TIMEOUT_SEC:-}
      SHINY_ODDS: ${SHINY_ODDS:-}
      SPAWN_POOL_SIZE: ${SPAWN_POOL_SIZE:-}
    depends_on:
      db:
        condition: service_healthy
    # Waits for the database, runs `prisma migrate deploy` with retries and then
    # starts the bot. See docker-entrypoint.sh for the details.
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:''+(process.env.PORT||5000)+''/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - pokebot-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # The connector dials out to Cloudflare and delivers traffic straight to
    # the bot over the private overlay network. No published ports, no proxy.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - bot
    networks:
      - pokebot-net

volumes:
  postgres_data:
    driver: local

networks:
  # An attachable Swarm overlay network runs inside an isolated Swarm network
  # namespace, preventing host-level firewalld/br_netfilter rules on Fedora/RHEL
  # from rejecting container-to-container bridge packets with EHOSTUNREACH.
  pokebot-net:
    driver: overlay
    attachable: true
